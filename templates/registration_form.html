<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 30px;
            width: 350px;

            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;

            border: 1px solid #ccc;
            border-radius: 5px;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;

            border: none;
            border-radius: 5px;

            cursor: pointer;
            font-size: 16px;
        }



        .errorlist {
            color: red;
            list-style: none;
            padding: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        {% if messages %}
            {% for message in messages %}
                <div style="color: green; text-align:center; margin-bottom: 10px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            <h2>Event Registration</h2>
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
